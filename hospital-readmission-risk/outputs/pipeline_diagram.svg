<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="220" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f5e5a"/>
    </marker>
  </defs>

  <!-- Step boxes -->
  <g font-size="13" text-anchor="middle">
    <!-- 1 -->
    <rect x="20" y="70" width="130" height="70" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <text x="85" y="98" font-weight="bold" fill="#0C447C">Raw data</text>
    <text x="85" y="116" fill="#0C447C">6,000 encounters</text>

    <!-- 2 -->
    <rect x="175" y="70" width="130" height="70" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <text x="240" y="98" font-weight="bold" fill="#3C3489">Clean</text>
    <text x="240" y="116" fill="#3C3489">dedupe, impute</text>

    <!-- 3 -->
    <rect x="330" y="70" width="150" height="70" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <text x="405" y="92" font-weight="bold" fill="#3C3489">Preprocess</text>
    <text x="405" y="110" fill="#3C3489">scale numeric,</text>
    <text x="405" y="126" fill="#3C3489">one-hot categorical</text>

    <!-- 4 -->
    <rect x="510" y="70" width="150" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <text x="585" y="92" font-weight="bold" fill="#085041">Logistic regression</text>
    <text x="585" y="110" fill="#085041">L2 regularized</text>
    <text x="585" y="126" fill="#085041">class_weight=balanced</text>

    <!-- 5 -->
    <rect x="690" y="70" width="190" height="70" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
    <text x="785" y="92" font-weight="bold" fill="#633806">Cost-optimal</text>
    <text x="785" y="110" fill="#633806">threshold search</text>
    <text x="785" y="126" fill="#633806">(FN=$5000, FP=$500)</text>
  </g>

  <!-- Arrows -->
  <line x1="150" y1="105" x2="172" y2="105" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="305" y1="105" x2="327" y2="105" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="105" x2="507" y2="105" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="660" y1="105" x2="687" y2="105" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="450" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#2C2C2A">Hospital readmission risk — pipeline</text>
  <text x="450" y="185" text-anchor="middle" font-size="12" fill="#5f5e5a">Output: readmission probability per patient -&gt; flagged high-risk if probability &gt; 0.54</text>
</svg>
